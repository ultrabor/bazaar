version: "2"

linters:
  enable:
    - depguard
  settings:
    depguard:
      # Module boundaries: see docs/architecture.md. A module may import
      # only the modules listed for it; platform imports no module.
      rules:
        platform:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: "bazaar/internal/modules/auth"
              desc: platform must not depend on modules
            - pkg: "bazaar/internal/modules/category"
              desc: platform must not depend on modules
            - pkg: "bazaar/internal/modules/location"
              desc: platform must not depend on modules
            - pkg: "bazaar/internal/modules/permission"
              desc: platform must not depend on modules
            - pkg: "bazaar/internal/modules/product"
              desc: platform must not depend on modules
            - pkg: "bazaar/internal/modules/role"
              desc: platform must not depend on modules
            - pkg: "bazaar/internal/modules/user"
              desc: platform must not depend on modules
        auth:
          files:
            - "**/internal/modules/auth/**"
          deny:
            - pkg: "bazaar/internal/modules/category"
              desc: "auth may import only: role"
            - pkg: "bazaar/internal/modules/location"
              desc: "auth may import only: role"
            - pkg: "bazaar/internal/modules/permission"
              desc: "auth may import only: role"
            - pkg: "bazaar/internal/modules/product"
              desc: "auth may import only: role"
            - pkg: "bazaar/internal/modules/user"
              desc: "auth may import only: role"
        category:
          files:
            - "**/internal/modules/category/**"
          deny:
            - pkg: "bazaar/internal/modules/auth"
              desc: "category may import only: no other module"
            - pkg: "bazaar/internal/modules/location"
              desc: "category may import only: no other module"
            - pkg: "bazaar/internal/modules/permission"
              desc: "category may import only: no other module"
            - pkg: "bazaar/internal/modules/product"
              desc: "category may import only: no other module"
            - pkg: "bazaar/internal/modules/role"
              desc: "category may import only: no other module"
            - pkg: "bazaar/internal/modules/user"
              desc: "category may import only: no other module"
        location:
          files:
            - "**/internal/modules/location/**"
          deny:
            - pkg: "bazaar/internal/modules/auth"
              desc: "location may import only: no other module"
            - pkg: "bazaar/internal/modules/category"
              desc: "location may import only: no other module"
            - pkg: "bazaar/internal/modules/permission"
              desc: "location may import only: no other module"
            - pkg: "bazaar/internal/modules/product"
              desc: "location may import only: no other module"
            - pkg: "bazaar/internal/modules/role"
              desc: "location may import only: no other module"
            - pkg: "bazaar/internal/modules/user"
              desc: "location may import only: no other module"
        permission:
          files:
            - "**/internal/modules/permission/**"
          deny:
            - pkg: "bazaar/internal/modules/auth"
              desc: "permission may import only: user"
            - pkg: "bazaar/internal/modules/category"
              desc: "permission may import only: user"
            - pkg: "bazaar/internal/modules/location"
              desc: "permission may import only: user"
            - pkg: "bazaar/internal/modules/product"
              desc: "permission may import only: user"
            - pkg: "bazaar/internal/modules/role"
              desc: "permission may import only: user"
        product:
          files:
            - "**/internal/modules/product/**"
          deny:
            - pkg: "bazaar/internal/modules/auth"
              desc: "product may import only: no other module"
            - pkg: "bazaar/internal/modules/category"
              desc: "product may import only: no other module"
            - pkg: "bazaar/internal/modules/location"
              desc: "product may import only: no other module"
            - pkg: "bazaar/internal/modules/permission"
              desc: "product may import only: no other module"
            - pkg: "bazaar/internal/modules/role"
              desc: "product may import only: no other module"
            - pkg: "bazaar/internal/modules/user"
              desc: "product may import only: no other module"
        role:
          files:
            - "**/internal/modules/role/**"
          deny:
            - pkg: "bazaar/internal/modules/auth"
              desc: "role may import only: no other module"
            - pkg: "bazaar/internal/modules/category"
              desc: "role may import only: no other module"
            - pkg: "bazaar/internal/modules/location"
              desc: "role may import only: no other module"
            - pkg: "bazaar/internal/modules/permission"
              desc: "role may import only: no other module"
            - pkg: "bazaar/internal/modules/product"
              desc: "role may import only: no other module"
            - pkg: "bazaar/internal/modules/user"
              desc: "role may import only: no other module"
        user:
          files:
            - "**/internal/modules/user/**"
          deny:
            - pkg: "bazaar/internal/modules/auth"
              desc: "user may import only: role"
            - pkg: "bazaar/internal/modules/category"
              desc: "user may import only: role"
            - pkg: "bazaar/internal/modules/location"
              desc: "user may import only: role"
            - pkg: "bazaar/internal/modules/permission"
              desc: "user may import only: role"
            - pkg: "bazaar/internal/modules/product"
              desc: "user may import only: role"

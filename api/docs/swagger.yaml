        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx_dto.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx_dto.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx_dto.Error'

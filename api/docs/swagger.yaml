info:
  contact: {}
  description: Bazaar inventory and sales API
  title: Bazaar
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginResponse'
        "400":
          description: Invalid login data
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      summary: Login a user
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bazaar_internal_platform_identity.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - Auth
  /auth/register-owner:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterOwnerBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.RegisterResponse'
        "400":
          description: Invalid registration data
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "409":
          description: Phone already registered
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      summary: Register a company owner
      tags:
      - Auth
  /category:
    get:
      consumes:
      - application/json
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Active categories; empty array when no categories match
          schema:
            items:
              $ref: '#/definitions/internal_category.Category'
            type: array
        "400":
          description: Invalid pagination
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Get active categories for the current user's company
      tags:
      - Category
    post:
      consumes:
      - application/json
      parameters:
      - description: Category data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_category.CreateCategoryBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_category.CreateCategoryResponse'
        "400":
          description: Invalid JSON or empty name
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "409":
          description: Active category name already exists
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Create a category
      tags:
      - Category
  /category/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_category.Category'
        "400":
          description: Invalid category UUID
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Get a category by ID
      tags:
      - Category
    put:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_category.UpdateCategoryBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_category.UpdateCategoryResponse'
        "400":
          description: Invalid category UUID, JSON, or empty name
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "409":
          description: Active category name already exists
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Rename a category
      tags:
      - Category
  /category/{id}/archive:
    patch:
      consumes:
      - application/json
      description: Products keep their category_id and remain visible. Archived categories
        cannot be assigned to other products.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Invalid category UUID
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Archive a category
      tags:
      - Category
  /healthz:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Liveness probe
      tags:
      - Health
  /location:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_location.Location'
            type: array
        "400":
          description: Invalid credential data
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Location not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Get all locations for the current user's company
      tags:
      - Location
    post:

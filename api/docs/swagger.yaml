  /product:
    get:
      consumes:
      - application/json
      parameters:
      - description: Case-insensitive literal product name substring
        in: query
        name: name
        type: string
      - description: Exact product SKU
        in: query
        name: sku
        type: string
      - description: Product unit
        enum:
        - kg
        - meter
        - piece
        - liter
        in: query
        name: unit
        type: string
      - description: Category UUID
        in: query
        name: category_id
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Matching active products; empty array when no products match
          schema:
            items:
              $ref: '#/definitions/internal_product.Product'
            type: array
        "400":
          description: Invalid unit, category UUID, or pagination parameters
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Get all Products for the current user's company
      tags:
      - Product
    post:
      consumes:
      - application/json
      description: category_id is optional and must reference an active category owned
        by the current company.
      parameters:
      - description: Product creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_product.CreateProductBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_product.CreateProductResponse'
        "400":
          description: Invalid JSON, product fields, or category UUID
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "409":
          description: Duplicate SKU
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'

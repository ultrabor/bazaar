        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_location.Location'
        "400":
          description: Invalid credential data
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Location not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Get location by ID
      tags:
      - Location
    put:
      consumes:
      - application/json
      parameters:
      - description: Location ID
        in: path
        name: id
        required: true
        type: string
      - description: Location update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_location.UpdateLocationBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_location.UpdateLocationResponse'
        "400":
          description: Invalid credential data
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Location not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "409":
          description: Location already exists
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
      security:
      - BearerAuth: []
      summary: Update location by ID
      tags:
      - Location
  /location/{id}/archive:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Location ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Invalid credential data
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "404":
          description: Location not found
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/bazaar_internal_platform_httpx.Error'
